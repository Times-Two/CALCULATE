<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="caculate.css">
</head>
<body>

    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">
            <!-- New operation buttons -->
            <button onclick="percentage()" class="operation-btn">%</button>
            <button onclick="squareRoot()" class="operation-btn">√</button>
            <button onclick="square()" class="operation-btn">x²</button>
            <button onclick="inverse()" class="operation-btn">1/x</button>

            <!-- Number and operator buttons -->
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('+')" class="operation-btn">+</button>

            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('-')" class="operation-btn">-</button>

            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('×')" class="operation-btn">×</button>

            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="calculate()" class="calculate">=</button>
            <button onclick="appendToDisplay('÷')" class="operation-btn">÷</button>

            <button onclick="backspace()" class="operation-btnn">x</button> <!-- Delete last input -->
            <button onclick="clearDisplay()" class="operation-btnn">DEL</button> <!-- Clear all -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
